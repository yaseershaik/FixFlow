version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - SESSION_SECRET=change-this-in-production-to-a-random-secure-secret-64-chars
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - fixflow-data:/app/data
      - fixflow-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fixflow-data:
    driver: local
  fixflow-uploads:
    driver: local
